# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  auto_review:
    enabled: true
    drafts: false   # không review PR draft

  request_changes_workflow: true

  high_level_summary: true

  review_status: true

  poem: false

  finishing_touches:
    docstrings:
      enabled: false

  high_level_summary_instructions: |
    After the standard summary, always append a PR Scorecard section.
    Use this exact format — no exceptions, even for small or trivial PRs:

    ## PR Scorecard

    | Category        | Score | Notes |
    |-----------------|-------|-------|
    | Overall Quality | X/10  | ...   |
    | Performance     | X/10  | ...   |
    | Security        | X/10  | ...   |
    | Maintainability | X/10  | ...   |

    Scoring guide:
    - 9–10: Excellent — no meaningful issues
    - 7–8:  Good — minor issues only
    - 5–6:  Acceptable — noticeable issues that should be addressed
    - 3–4:  Needs work — significant issues present
    - 1–2:  Poor — critical issues, PR should not merge as-is

    Score each category independently:
    - **Overall Quality**: correctness, completeness, adherence to project conventions
    - **Performance**: render efficiency, unnecessary re-renders, bundle size impact, expensive operations
    - **Security**: input validation, XSS risks, sensitive data exposure, dependency vulnerabilities
    - **Maintainability**: readability, naming, component size, separation of concerns, TypeScript strictness

    End with a one-sentence **Verdict**: ready to merge, needs minor fixes, or requires significant rework.

  path_instructions:
    - path: "**"
      instructions: |
        When finishing the review, contribute scores for the PR Scorecard:
        Overall Quality, Performance, Security, and Maintainability — each on a 1–10 scale.
